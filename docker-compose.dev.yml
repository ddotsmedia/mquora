services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: askvyo_dev
      POSTGRES_USER: askvyo
      POSTGRES_PASSWORD: askvyo
    ports:
      - "5433:5432"
    volumes:
      - askvyo_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "askvyo"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"

volumes:
  askvyo_dev_postgres: {}
