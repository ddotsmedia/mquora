services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mquora_dev
      POSTGRES_USER: mquora
      POSTGRES_PASSWORD: mquora
    ports:
      - "5433:5432"
    volumes:
      - mquora_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mquora"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"

volumes:
  mquora_dev_postgres: {}
