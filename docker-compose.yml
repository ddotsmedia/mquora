version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: askvyo-postgres
    environment:
      POSTGRES_USER: askvyo
      POSTGRES_PASSWORD: askvyo
      POSTGRES_DB: askvyo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - askvyo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askvyo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: askvyo-redis
    networks:
      - askvyo_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  askvyo_net:
    driver: bridge
