version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mquora-postgres
    environment:
      POSTGRES_USER: mquora
      POSTGRES_PASSWORD: mquora
      POSTGRES_DB: mquora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mquora_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mquora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mquora-redis
    networks:
      - mquora_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  mquora_net:
    driver: bridge
