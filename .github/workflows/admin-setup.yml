name: Admin Setup

on:
  workflow_dispatch:

env:
  ADMIN_EMAIL: admin@askvyo.com
  ADMIN_USERNAME: admin
  ADMIN_DISPLAY_NAME: Admin

jobs:
  setup-admin:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Verify target server is the askvyo VPS (never touch the shared VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          EXPECTED_HOSTNAME: ${{ vars.VPS_HOSTNAME || 'srv1778407' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/guard_key && chmod 600 ~/.ssh/guard_key
          actual=$(ssh -i ~/.ssh/guard_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" hostname)
          if [ "$actual" != "$EXPECTED_HOSTNAME" ]; then
            echo "::error::VPS_HOST points to server '$actual', expected '$EXPECTED_HOSTNAME'. Refusing to continue."
            exit 1
          fi
          echo "Target server verified: $actual"

      - name: Initialize admin on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new)

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "ERROR: ADMIN_PASSWORD secret is not set"
            exit 1
          fi

          echo "Running admin initialization..."
          # The password is sent over stdin, never as a command argument, so it does not
          # appear in the VPS process list. The remote side passes it to docker by name only.
          {
            printf '%s\n' "$ADMIN_PASSWORD"
            cat <<'EOFSCRIPT'
          set -e
          cd /opt/askvyo
          docker ps -aq --filter 'name=^askvyo-api-run-' | xargs -r docker rm -f
          docker compose -p askvyo -f docker-compose.prod.yml --env-file .env run -T \
            --rm --no-deps -e ADMIN_PASSWORD -e ADMIN_EMAIL api \
            node packages/db/prisma/ensure-admin.mjs
          EOFSCRIPT
          } | ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            "IFS= read -r ADMIN_PASSWORD && export ADMIN_PASSWORD ADMIN_EMAIL='$ADMIN_EMAIL' && bash -s"

          echo "Verifying admin account..."
          curl -fsS --max-time 10 "http://$VPS_HOST:3024/health" || {
            echo "WARNING: API health check failed, but admin init may have succeeded"
          }

          echo "Admin setup completed. Log in at: https://${{ vars.PUBLIC_DOMAIN || secrets.PUBLIC_DOMAIN }}/admin"
