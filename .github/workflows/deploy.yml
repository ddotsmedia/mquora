name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-askvyo
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm --filter @askvyo/db exec prisma generate
      - name: Type check
        run: |
          pnpm --filter @askvyo/api type-check
          pnpm --filter @askvyo/worker type-check
          pnpm --filter @askvyo/web type-check

  build-push:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ (vars.PUBLIC_DOMAIN || secrets.PUBLIC_DOMAIN) && format('https://{0}', vars.PUBLIC_DOMAIN || secrets.PUBLIC_DOMAIN) || vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify target server is the askvyo VPS (never touch the shared VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          EXPECTED_HOSTNAME: ${{ vars.VPS_HOSTNAME || 'srv1778407' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/guard_key && chmod 600 ~/.ssh/guard_key
          actual=$(ssh -i ~/.ssh/guard_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" hostname)
          if [ "$actual" != "$EXPECTED_HOSTNAME" ]; then
            echo "::error::VPS_HOST points to server '$actual', expected '$EXPECTED_HOSTNAME'. Refusing to continue."
            exit 1
          fi
          echo "Target server verified: $actual"

      - name: Build production env file (kept out of git)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || secrets.PUBLIC_DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p .deploy
          printf '%s\n' "$PROD_ENV" > .deploy/prod.env
          printf 'GITHUB_REPOSITORY=%s\nIMAGE_TAG=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> .deploy/prod.env
          # Public domain (repo variable PUBLIC_DOMAIN, e.g. askvyo.com) overrides the URL settings in PROD_ENV.
          if [ -n "$PUBLIC_DOMAIN" ]; then
            {
              echo "PUBLIC_DOMAIN=$PUBLIC_DOMAIN"
              echo "NEXTAUTH_URL=https://$PUBLIC_DOMAIN"
              echo "NEXT_PUBLIC_API_URL=https://$PUBLIC_DOMAIN"
              echo "ALLOWED_ORIGINS=https://$PUBLIC_DOMAIN,https://www.$PUBLIC_DOMAIN,http://${VPS_HOST}:3022"
            } >> .deploy/prod.env
          fi
          chmod 600 .deploy/prod.env

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/askvyo/scripts

      - name: Copy compose file, deploy script and env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=accept-new)
          SSH_BASE=(-i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new)
          scp "${SSH_OPTS[@]}" docker-compose.prod.yml deploy/Caddyfile .deploy/prod.env "$VPS_USER@$VPS_HOST:/opt/askvyo/"
          scp "${SSH_OPTS[@]}" scripts/deploy.sh scripts/backup.sh "$VPS_USER@$VPS_HOST:/opt/askvyo/scripts/"
          ssh "${SSH_BASE[@]}" "$VPS_USER@$VPS_HOST" "chmod +x /opt/askvyo/scripts/deploy.sh /opt/askvyo/scripts/backup.sh && ls -la /opt/askvyo"

      - name: Deploy on VPS (pull images only, no builds)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pass GHCR_TOKEN and GITHUB_ACTOR explicitly into the remote shell via env
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o SendEnv=GHCR_TOKEN -o SendEnv=GITHUB_ACTOR \
            "$VPS_USER@$VPS_HOST" \
            "GHCR_TOKEN='$GHCR_TOKEN' GITHUB_ACTOR='$GITHUB_ACTOR' bash -x /opt/askvyo/scripts/deploy.sh" 2>&1

      - name: Smoke test (API and web)
        run: |
          sleep 20
          curl -fsS --max-time 15 "http://${{ secrets.VPS_HOST }}:3024/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://${{ secrets.VPS_HOST }}:3022/")
          echo "web status: $code"
          [ "$code" -lt 500 ]
