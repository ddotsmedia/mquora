upstream askvyo_web {
  server web:3000;
}

upstream askvyo_api {
  server api:3100;
}

# Defense-in-depth: per-IP rate limiting as a backstop if NestJS throttle guards are misconfigured.
# NestJS throttle guards handle the fine-grained per-endpoint limits.
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  # API routes
  location /api/v1/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://askvyo_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Health check endpoint
  location /health {
    proxy_pass http://askvyo_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # All other routes to web
  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://askvyo_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
