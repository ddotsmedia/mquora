upstream mquora_web {
  server web:3000;
}

upstream mquora_api {
  server api:3100;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  # API routes
  location /api/v1/ {
    proxy_pass http://mquora_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Health check endpoint
  location /health {
    proxy_pass http://mquora_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # All other routes to web
  location / {
    proxy_pass http://mquora_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
