packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@parcel/watcher': true
  argon2: true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  'unrs-resolver': true
  workerd: true
overrides:
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  sharp: '>=0.35.5'
  uuid: '>=11.1.1'
  next: '>=16.4.3'
  tar: '>=7.5.21'
  shell-quote: '>=1.11.0'
  '@xmldom/xmldom': '>=0.8.15'
  postcss: '>=8.5.23'
  fast-uri: '>=3.1.9'
  glob: '>=14.0.2'
  minimatch: '>=11.0.1'
  qs: '>=6.16.1'
  follow-redirects: '>=1.16.2'
  image-size: '>=2.0.3'
  node-forge: '>=1.4.3'
  decode-uri-component: '>=0.5.1'
