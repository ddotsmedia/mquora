packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@parcel/watcher': true
  argon2: true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  'unrs-resolver': true
  workerd: true
overrides:
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  sharp: '>=0.35.5'
  uuid: '>=11.1.1'
  next: '>=16.4.3'
