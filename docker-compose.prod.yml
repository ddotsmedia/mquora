version: '3.9'

services:
  web:
    image: mquora-web:latest
    container_name: mquora-web
    restart: unless-stopped
    ports:
      - "3022:3000"
    environment:
      NODE_ENV: production
      API_URL: http://api:3100
    networks:
      - mquora_net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: mquora-api:latest
    container_name: mquora-api
    restart: unless-stopped
    ports:
      - "3100"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mquora:${DB_PASSWORD}@postgres:5432/mquora
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://ai-gateway:8000}
      API_PORT: 3100
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    networks:
      - mquora_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: mquora-worker:latest
    container_name: mquora-worker
    restart: unless-stopped
    ports:
      - "3023"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mquora:${DB_PASSWORD}@postgres:5432/mquora
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://ai-gateway:8000}
      WORKER_PORT: 3023
    networks:
      - mquora_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3023/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: mquora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mquora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mquora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mquora_net
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mquora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mquora-redis
    restart: unless-stopped
    networks:
      - mquora_net
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: mquora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - mquora_net
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:

networks:
  mquora_net:
    driver: bridge
