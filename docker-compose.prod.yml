# Production stack for the VPS. Images are built on GitHub Actions and pulled here.
# Host ports are fixed per the VPS port plan: web 3022, api 3024, worker 3023.
# Postgres and Redis are private to this project's network; they are not published.
name: askvyo

services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${IMAGE_TAG}
    ports:
      - '3022:3000'
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_INTERNAL_URL=http://api:3100
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - AUTH_GOOGLE_ID=${GOOGLE_CLIENT_ID}
      - AUTH_GOOGLE_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks: [askvyo_net]
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    restart: unless-stopped

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG}
    ports:
      - '3024:3100'
    environment:
      - PORT=3100
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL}
      - WORKER_HOST=worker
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:support@askvyo.com}
      - SITE_URL=${SITE_URL:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
    networks: [askvyo_net]
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    depends_on: [postgres, redis]
    restart: unless-stopped

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/worker:${IMAGE_TAG}
    environment:
      - PORT=3023
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=redis
      - AI_GATEWAY_URL=${AI_GATEWAY_URL}
    networks: [askvyo_net]
    deploy:
      resources:
        limits: {memory: 1g, cpus: '1.0'}
    depends_on: [postgres, redis]
    restart: unless-stopped

  # HTTPS reverse proxy for the public domain. Only started when PUBLIC_DOMAIN is set
  # and ports 80/443 are free (see scripts/deploy.sh).
  caddy:
    image: caddy:2.8-alpine
    profiles: [proxy]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - askvyo_caddy_data:/data
      - askvyo_caddy_config:/config
    networks: [askvyo_net]
    depends_on: [web, api]
    deploy:
      resources:
        limits: {memory: 128m}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - askvyo_postgres:/var/lib/postgresql/data
    networks: [askvyo_net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 2g}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - askvyo_redis:/data
    networks: [askvyo_net]
    deploy:
      resources:
        limits: {memory: 256m}
    restart: unless-stopped

volumes:
  askvyo_postgres: {}
  askvyo_redis: {}
  askvyo_caddy_data: {}
  askvyo_caddy_config: {}

networks:
  askvyo_net:
    name: askvyo_net
    driver: bridge
