# Production stack for the VPS. Images are built on GitHub Actions and pulled here.
# Host ports are fixed per the VPS port plan: web 3022, api 3024, worker 3023.
# Postgres and Redis are private to this project's network; they are not published.
name: mquora

services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${IMAGE_TAG}
    ports:
      - '3022:3000'
    environment:
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks: [mquora_net]
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    restart: unless-stopped

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${IMAGE_TAG}
    ports:
      - '3024:3100'
    environment:
      - PORT=3100
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL}
      - WORKER_HOST=worker
    networks: [mquora_net]
    deploy:
      resources:
        limits: {memory: 512m, cpus: '0.5'}
    depends_on: [postgres, redis]
    restart: unless-stopped

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/worker:${IMAGE_TAG}
    environment:
      - PORT=3023
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AI_GATEWAY_URL=${AI_GATEWAY_URL}
    networks: [mquora_net]
    deploy:
      resources:
        limits: {memory: 1g, cpus: '1.0'}
    depends_on: [postgres, redis]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - mquora_postgres:/var/lib/postgresql/data
    networks: [mquora_net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 2g}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - mquora_redis:/data
    networks: [mquora_net]
    deploy:
      resources:
        limits: {memory: 256m}
    restart: unless-stopped

volumes:
  mquora_postgres: {}
  mquora_redis: {}

networks:
  mquora_net:
    name: mquora_net
    driver: bridge
